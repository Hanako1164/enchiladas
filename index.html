<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>

    <a-scene
      mindar-image="imageTargetSrc: ./markerc.mind;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >

      <a-assets>

        <!-- Ralsei animado -->
        <video
          id="ralsei"
          src="./Ralsei.webm"
          loop
          muted
          playsinline
          webkit-playsinline>
        </video>

        <!-- Modelo 3D -->
        <a-asset-item
          id="avatarModel"
          src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/softmind/scene.gltf">
        </a-asset-item>

      </a-assets>

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">

        <!-- Ralsei -->
        <a-video
          src="#ralsei"
          position="0 0 0"
          width="1"
          height="0.552"
          rotation="0 0 0">
        </a-video>

        <!-- Modelo 3D -->
        <a-gltf-model
          rotation="0 0 0"
          position="0 0 0.1"
          scale="0.005 0.005 0.005"
          src="#avatarModel"
          animation="
            property: position;
            to: 0 0.1 0.1;
            dur: 1000;
            easing: easeInOutQuad;
            loop: true;
            dir: alternate">
        </a-gltf-model>

      </a-entity>

    </a-scene>


    <script>

      const target = document.querySelector("#target");
      const video = document.querySelector("#ralsei");

      // Cuando encuentra el marcador
      target.addEventListener("targetFound", () => {

        console.log("Marcador encontrado");

        video.currentTime = 0;

        video.play().catch(error => {
          console.log("No se pudo reproducir automáticamente:", error);
        });

      });

      // Cuando pierde el marcador
      target.addEventListener("targetLost", () => {

        console.log("Marcador perdido");

        video.pause();

      });

    </script>

  </body>
</html>
